name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    uses: ./.github/workflows/candidate-package.yml

  linux-native:
    name: Linux native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Identify Rust toolchain for dependency cache
        id: rust-cache-key
        shell: bash
        run: printf 'hash=%s\n' "$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust dependencies and build intermediates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/linux/bridge-rs/target
          key: cargo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-key.outputs.hash }}-${{ hashFiles('native/linux/bridge-rs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-key.outputs.hash }}-${{ hashFiles('native/linux/bridge-rs/Cargo.lock') }}-
      - name: Run Linux platform checks
        run: npm run typecheck && npm run test:linux && npm run test:linux-scripts

      - name: Test and lint Linux helper
        if: matrix.arch == 'x64'
        working-directory: native/linux/bridge-rs
        run: |
          cargo test --locked -j1
          dbus-run-session -- cargo test --locked -j1 registry_id_does_not_override_actual_bus_process_id -- --ignored
          dbus-run-session -- cargo test --locked -j1 service_failure_after_mutation_preserves_unknown_and_never_replays -- --ignored
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Build Linux helper
        run: npm run build:linux -- --arch "${{ matrix.arch }}"

      - name: Validate Linux helper
        run: |
          set -euo pipefail
          binary="prebuilt/linux/${{ matrix.arch }}/linux-bridge"
          test -x "$binary"
          file "$binary" | grep -q 'ELF 64-bit'
