name: Workbench cross-platform package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-package-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    uses: ./.github/workflows/candidate-package.yml
    permissions:
      contents: read
  publish:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: checked-candidate-${{ github.sha }}
          path: dist
      - name: Verify checked package without rebuilding or repacking
        run: python3 scripts/verify-workbench-candidate.py --directory dist --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          gh release create "v$version" dist/*.tgz dist/SHA256SUMS dist/provenance.json --target "$GITHUB_SHA" --title "Workbench $version" --notes "Final checked source and native helpers for Windows, Linux, and macOS. Mac upgrades use LOCAL_BUILD and the existing local signing pin; no local private identity is distributed."
