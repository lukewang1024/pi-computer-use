<!doctype html><html><head><title>CU P0 Browser</title></head><body><h1>CU P0 Browser</h1><button id="count" onclick="audit.count++;document.getElementById('result').textContent='Browser count: '+audit.count">Browser button</button><p id="result">Browser count: 0</p><label><input id="check" type="checkbox" onchange="audit.check=this.checked">Browser checkbox</label><button onclick="audit.opens++;document.getElementById('modal').showModal()">Open browser dialog</button><dialog id="modal"><label>Browser label<input id="label"></label><button onclick="audit.label=document.getElementById('label').value;audit.confirms++;document.getElementById('modal').close();document.getElementById('labelresult').textContent=audit.label">Confirm browser dialog</button></dialog><p id="labelresult"></p><script>window.audit={count:0,check:false,opens:0,confirms:0,label:''}</script></body></html>
